<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Battle Arena ChatGPT</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #182b24; color: #fff; font: 16px Arial, sans-serif; }
    main { width: min(680px, calc(100% - 24px)); height: min(720px, calc(100vh - 24px)); display: flex; flex-direction: column; border: 1px solid #ffffff66; border-radius: 16px; overflow: hidden; background: #07111d; }
    h1 { margin: 0; padding: 16px; color: #ffca42; font-size: 22px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; }
    .message { max-width: 85%; margin: 8px 0; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; }
    .user { margin-left: auto; background: #2689c7; }
    .assistant { background: #2b4035; }
    .error { background: #8d2930; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ffffff33; }
    input { flex: 1; min-width: 0; border: 1px solid #ffffff66; border-radius: 10px; padding: 12px; background: #142c40; color: #fff; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #d83c27; color: #fff; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
<main>
  <h1>Battle Arena AI</h1>
  <div id="messages" role="log" aria-live="polite"></div>
  <form id="chat-form">
    <input id="prompt" name="prompt" autocomplete="off" placeholder="Ask for a mission hint…" required>
    <button id="send" type="submit">Send</button>
  </form>
</main>
<script>
const form = document.getElementById('chat-form');
const prompt = document.getElementById('prompt');
const messages = document.getElementById('messages');
const send = document.getElementById('send');
const history = [{ role: 'system', content: 'You are a helpful assistant for a 3D battle arena game. Keep answers concise, safe, and useful.' }];

function addMessage(role, text) {
  const element = document.createElement('div');
  element.className = `message ${role}`;
  element.textContent = text;
  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const text = prompt.value.trim();
  if (!text) return;
  prompt.value = '';
  prompt.disabled = true;
  send.disabled = true;
  addMessage('user', text);
  history.push({ role: 'user', content: text });

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Request failed');
    addMessage('assistant', data.reply);
    history.push({ role: 'assistant', content: data.reply });
  } catch (error) {
    addMessage('error', error.message);
  } finally {
    prompt.disabled = false;
    send.disabled = false;
    prompt.focus();
  }
});
</script>
</body>
</html>
