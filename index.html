<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mohamed Smadi: Battle Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#182b24;color:white;font:14px Arial;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:10px;left:10px;padding:10px;background:#07111ddd;border:1px solid #ffffff66;border-radius:10px;line-height:1.7;font-weight:bold}
#controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;align-items:end}
.pad{display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px 46px;gap:3px}
button{background:#142c40dd;color:white;border:2px solid #ffffff88;border-radius:12px;font-weight:bold;font-size:18px;touch-action:none}
.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.pad button:nth-child(5){grid-column:2;grid-row:3}
.actions{display:flex;flex-direction:column;gap:7px}.actions button{width:76px;height:48px;font-size:12px}
#screen{position:absolute;inset:0;background:#07111df2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}
#screen h1{color:#ffca42;font-size:30px}#screen button{padding:14px 28px;background:#d83c27;font-size:19px}
#toast{position:absolute;bottom:175px;left:50%;transform:translateX(-50%);background:#07111ddd;padding:8px;border-radius:8px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">MOHAMED SMADI<br>💵 $<span id="money">500</span><br>❤️ <span id="hp">100</span><br>⭐ <span id="stars">0</span><br>🔫 <span id="kills">0</span> wins</div>
<div id="toast">Explore the city and find a car!</div>
<div id="controls">
<div class="pad"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div class="actions"><button id="fire">SHOOT</button><button id="car">CAR</button><button id="mission">MISSION</button></div>
</div>
<div id="screen"><h1>MOHAMED SMADI</h1><h2>🏙️ BATTLE ARENA</h2><p>Explore the city, drive cars, defeat enemies and earn money.</p><p>Move: WASD / arrows. Shoot: Space. Car: E.</p><button id="start">START GAME</button></div>
<script>
const c=document.getElementById('game'),g=c.getContext('2d');
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:2200,h:1600},p={x:300,y:300,hp:100,money:500,kills:0,car:null};
let keys={},shots=[],foes=[],cars=[],cam={x:0,y:0},wanted=0,playing=false,mission=0,last=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function build(){
 cars=[];foes=[];
 for(let i=0;i<18;i++)cars.push({x:rand(100,2100),y:rand(100,1500),color:['#d43c32','#2689c7','#e6b83f','#eeeeee'][i%4],used:false});
 for(let i=0;i<16;i++)foes.push({x:rand(100,2100),y:rand(100,1500),hp:2,alive:true});
}
build();
function say(t){document.getElementById('toast').textContent=t}
function updateHud(){document.getElementById('money').textContent=p.money;document.getElementById('hp').textContent=Math.ceil(p.hp);document.getElementById('stars').textContent='★'.repeat(wanted);document.getElementById('kills').textContent=p.kills}
function move(x,y){let nx=p.x+x,ny=p.y+y;if(nx>25&&nx<world.w-25)p.x=nx;if(ny>25&&ny<world.h-25)p.y=ny}
function shoot(){let now=Date.now();if(!playing||now-last<250)return;last=now;let target=foes.find(e=>e.alive&&Math.hypot(e.x-p.x,e.y-p.y)<430);let a=target?Math.atan2(target.y-p.y,target.x-p.x):0;shots.push({x:p.x,y:p.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9,life:55});}
function toggleCar(){if(!playing)return;if(p.car){p.x=p.car.x+35;p.y=p.car.y;p.car.used=false;p.car=null;say('You left the car');return}let v=cars.find(v=>!v.used&&Math.hypot(v.x-p.x,v.y-p.y)<65);if(v){p.car=v;v.used=true;say('Car acquired! Drive with movement controls');}else say('Walk closer to a car');}
function doMission(){if(!playing)return;mission++;p.money+=250;wanted=Math.min(5,wanted+1);say('Mission completed! +$250');updateHud();if(mission%3===0){foes.push({x:rand(100,2100),y:rand(100,1500),hp:2,alive:true})}}
function tick(){
 if(!playing)return;
 let speed=p.car?5:2.8,dx=0,dy=0;
 if(keys.w||keys.ArrowUp)dy--;if(keys.s||keys.ArrowDown)dy++;if(keys.a||keys.ArrowLeft)dx--;if(keys.d||keys.ArrowRight)dx++;
 if(dx||dy){let l=Math.hypot(dx,dy);move(dx/l*speed,dy/l*speed);if(p.car){p.car.x=p.x;p.car.y=p.y}}
 for(let b of shots){b.x+=b.vx;b.y+=b.vy;b.life--;for(let e of foes)if(e.alive&&Math.hypot(e.x-b.x,e.y-b.y)<20){e.hp--;b.life=0;if(e.hp<=0){e.alive=false;p.kills++;p.money+=100;wanted=Math.min(5,wanted+1);say('Enemy defeated! +$100');updateHud()}}}
 shots=shots.filter(b=>b.life>0);
 for(let e of foes)if(e.alive&&Math.hypot(e.x-p.x,e.y-p.y)<300){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*.35;e.y+=Math.sin(a)*.35;if(Math.hypot(e.x-p.x,e.y-p.y)<24)p.hp=Math.max(0,p.hp-.04)}
 cam.x=Math.max(0,Math.min(world.w-W,p.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,p.y-H/2));
 updateHud();if(p.hp<=0){playing=false;say('Game over — refresh to restart')}
}
function draw(){
 g.clearRect(0,0,W,H);g.save();g.translate(-cam.x,-cam.y);
 g.fillStyle='#41634a';g.fillRect(0,0,world.w,world.h);
 // road grid
 g.fillStyle='#343b40';for(let x=0;x<world.w;x+=300)g.fillRect(x,0,76,world.h);for(let y=0;y<world.h;y+=280)g.fillRect(0,y,world.w,70);
 g.strokeStyle='#d6c88b';g.setLineDash([18,18]);g.lineWidth=2;for(let x=38;x<world.w;x+=300){g.beginPath();g.moveTo(x,0);g.lineTo(x,world.h);g.stroke()}for(let y=35;y<world.h;y+=280){g.beginPath();g.moveTo(0,y);g.lineTo(world.w,y);g.stroke()}g.setLineDash([]);
 // buildings
 for(let x=105;x<world.w;x+=300)for(let y=95;y<world.h;y+=280){g.fillStyle='#777d80';g.fillRect(x,y,160,135);g.fillStyle='#a8b2b4';g.fillRect(x+12,y+12,136,110);g.fillStyle='#51636a';for(let wx=x+25;wx<x+145;wx+=38)for(let wy=y+25;wy<y+110;wy+=38)g.fillRect(wx,wy,18,18)}
 // trees
 for(let x=30;x<world.w;x+=150)for(let y=30;y<world.h;y+=140){g.fillStyle='#244c32';g.beginPath();g.arc(x,y,13,0,7);g.fill()}
 for(let v of cars){g.fillStyle=v.color;g.fillRect(v.x-20,v.y-12,40,24);g.fillStyle='#bde4ed';g.fillRect(v.x-9,v.y-9,18,18);g.fillStyle='#111';g.fillRect(v.x-14,v.y-15,9,5);g.fillRect(v.x+7,v.y-15,9,5)}
 for(let e of foes)if(e.alive){g.fillStyle='#b92e35';g.beginPath();g.arc(e.x,e.y,13,0,7);g.fill();g.fillStyle='white';g.fillRect(e.x-7,e.y-20,14,3)}
 for(let b of shots){g.fillStyle='#ffe26a';g.beginPath();g.arc(b.x,b.y,4,0,7);g.fill()}
 g.fillStyle='#39b9ff';g.beginPath();g.arc(p.x,p.y,15,0,7);g.fill();g.fillStyle='white';g.fillRect(p.x-5,p.y-19,10,5);
 g.restore();
}
function loop(){tick();draw();requestAnimationFrame(loop)}loop();
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();shoot()}if(e.key.toLowerCase()==='e')toggleCar()});
addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointerleave','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>keys[k]=false))});
document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
document.getElementById('car').addEventListener('pointerdown',e=>{e.preventDefault();toggleCar()});
document.getElementById('mission').addEventListener('pointerdown',e=>{e.preventDefault();doMission()});
document.getElementById('start').onclick=()=>{document.getElementById('screen').style.display='none';playing=true;say('Welcome to the city, Mohamed!')};
</script>
</body>
</html>
